async function encryptResponse(data,spki){const pub=await crypto.subtle.importKey('spki',un64(spki),{name:'RSA-OAEP',hash:'SHA-256'},false,['encrypt']);const rawKey=crypto.getRandomValues(new Uint8Array(32)),aes=await importAES(rawKey),iv=crypto.getRandomValues(new Uint8Array(12));const packed=await compress(enc.encode(JSON.stringify(data)));return {kind:'hugo-response-envelope',v:1,id:data.id,z:packed.z,iv:b64(iv),key:b64(new Uint8Array(await crypto.subtle.encrypt('RSA-OAEP',pub,rawKey))),data:b64(new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},aes,packed.data)))};}
async function publishPacket(packet,topic){const data=b64(enc.encode(JSON.stringify(packet))),size=3000,total=Math.ceil(data.length/size);if(total>80)throw Error('응답 분량이 큽니다. 결과 파일로 전달해주세요.');for(let i=0;i<total;i++){const part={v:1,kind:'hugo-part',id:packet.id,n:i,total,data:data.slice(i*size,(i+1)*size)};const r=await fetch('https://ntfy.sh/'+topic,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(part),credentials:'omit',referrerPolicy:'no-referrer',signal:AbortSignal.timeout(18000)});if(!r.ok)throw Error(r.status===429?'중계 사용량을 초과했습니다. 결과 파일로 전달해주세요.':'응답 전송이 되지 않았습니다. 결과 파일로 전달해주세요.');const ack=await r.json();if(ack.event!=='message')throw Error('전송 확인을 받지 못했습니다.');if(i+1<total)await new Promise(r=>setTimeout(r,280));}}
async function finishGuest(){if(submitting||!isAnswers(guest.answers,true))return;submitting=true;const b=$('nextQuestion');b.disabled=true;b.textContent='전송 준비 중';try{receipt={kind:'hugo-interview-response',v:1,id:guest.id,personId:invite?.personId||null,name:cleanName(guest.name),relationship:guest.relationship.trim(),answers:guest.answers.slice(),createdAt:new Date().toISOString()};if(invite)guestPacket=await encryptResponse(receipt,invite.publicKey);let sent=false,msg='';if(invite?.relay){b.textContent='응답 전송 중';try{await publishPacket(guestPacket,invite.topic);sent=true;}catch(e){msg=e.message;}}renderCompletion(sent,msg);try{localStorage.removeItem(guestKey);}catch{}}catch(e){$('submitError').hidden=false;$('submitError').textContent=e.message;b.disabled=false;b.textContent='인터뷰 마치기';}finally{submitting=false;}}
function renderCompletion(sent,error){APP.replaceChildren();const c=el('section','center'),thanks=el('div','success');thanks.append(el('h1',null,'감사합니다!'),el('p','small',sent?'응답이 암호화되어 전송되었습니다.':invite?'응답을 작성했습니다. 아래 결과 파일을 현욱에게 전달해주세요.':'미리보기가 끝났습니다. 실제 응답은 전송하지 않았습니다.'));if(error)thanks.append(el('p','error',error));const row=el('div','row');if(invite){row.append(button(sent?'응답 백업 저장':'결과 파일 저장','line',()=>download(safeFile(guest.name)+'-인터뷰-응답.json',JSON.stringify(guestPacket))));if(invite.relay&&!sent)row.append(button('다시 전송','',async()=>{try{await publishPacket(guestPacket,invite.topic);renderCompletion(true,'');}catch(e){note(e.message);}}));}thanks.append(row);if(invite?.reply&&normalize(guest.name)===normalize(invite.target)){const delivery=el('div','delivery');delivery.append(el('h2',null,'박현욱이 생각한 '+invite.target+'에 대한 답변이 왔어요!'),button('답장 읽기','',()=>showMagazine(invite.target,invite.reply)));thanks.append(delivery);}c.append(thanks);APP.append(c);fireworks();}
function fireworks(){if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;const host=el('div','confetti');host.setAttribute('aria-hidden','true');for(let i=0;i<64;i++){const s=el('i'),angle=i/64*Math.PI*2,dist=100+(i%7)*34;s.style.setProperty('--x',Math.cos(angle)*dist+'px');s.style.setProperty('--y',Math.sin(angle)*dist+'px');s.style.setProperty('--delay',(i%3)*.14+'s');host.append(s);}document.body.append(host);setTimeout(()=>host.remove(),2300);}
function connectRelay(){if(relay)relay.close();relay=null;parts.clear();if(!state?.relayEnabled){if($('connection'))$('connection').textContent='실시간 수신 꺼짐';return;}if($('connection'))$('connection').textContent='실시간 연결 중';relay=new EventSource('https://ntfy.sh/'+state.topic+'/sse?since=all');relay.onopen=()=>{if($('connection'))$('connection').textContent='실시간 수신 연결됨';};relay.onerror=()=>{if($('connection'))$('connection').textContent='연결 대기 · 파일 가져오기도 가능';};relay.onmessage=e=>{relayQueue=relayQueue.catch(()=>{}).then(()=>handleEvent(e)).catch(()=>{});};}
async function handleEvent(event){if(!state)return;let outer,part;try{outer=JSON.parse(event.data);part=JSON.parse(outer.message);}catch{return;}if(part.kind!=='hugo-part'||typeof part.id!=='string'||!Number.isInteger(part.n)||!Number.isInteger(part.total)||part.total<1||part.total>80||part.n<0||part.n>=part.total||typeof part.data!=='string'||part.data.length>3100||state.responses.some(r=>r.id===part.id))return;if(parts.size>200)parts.delete(parts.keys().next().value);let entry=parts.get(part.id);if(!entry){entry={total:part.total,chunks:new Map()};parts.set(part.id,entry);}if(entry.total!==part.total)return;entry.chunks.set(part.n,part.data);if(entry.chunks.size===entry.total){parts.delete(part.id);const blob=Array.from({length:entry.total},(_,i)=>entry.chunks.get(i)).join('');await acceptEnvelope(JSON.parse(dec.decode(un64(blob))));}}
async function acceptEnvelope(box){if(!state||box?.kind!=='hugo-response-envelope'||typeof box.id!=='string'||state.responses.some(r=>r.id===box.id))return;const priv=await crypto.subtle.importKey('pkcs8',un64(state.privateKey),{name:'RSA-OAEP',hash:'SHA-256'},false,['decrypt']);const aes=await importAES(await crypto.subtle.decrypt('RSA-OAEP',priv,un64(box.key)));const data=JSON.parse(dec.decode(await unpack(new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:un64(box.iv)},aes,un64(box.data))),box.z)));if(data.kind!=='hugo-interview-response'||!isAnswers(data.answers,true)||typeof data.name!=='string'||typeof data.relationship!=='string'||data.id!==box.id||!Number.isFinite(Date.parse(data.createdAt)))throw Error('유효하지 않은 응답입니다.');let p=state.people.find(p=>p.id===data.personId);if(p&&normalize(p.name)!==normalize(data.name))throw Error('이름이 맞지 않습니다.');if(!p){p={id:uuid(),name:cleanName(data.name),relationship:data.relationship.slice(0,120),answers:Array(10).fill(''),replies:Array(10).fill(''),ready:false};state.people.push(p);}data.personId=p.id;state.responses.push(data);if(!selected)selected=p.id;await save();renderPeople();if($('originalText')&&selected===p.id)$('originalText').textContent=data.answers[qIndex];if(!$('replyInput'))renderEditor();note(data.name+' 님의 응답이 도착했습니다.');}
function showMagazine(name,answers){const target=$('magazine');target.replaceChildren();for(let page=0;page<2;page++){const paper=el('article','paper');const head=el('div','paper-head');head.append(el('span',null,name+'에게'),el('span',null,'박현욱'));paper.append(head);const body=el('div','paper-body');for(let i=page*5;i<(page+1)*5;i++){const s=el('section');s.append(el('h3',null,pad(i+1)+'. '+forPerson(name,i)),el('p',null,answers[i]||'아직 작성하지 않았습니다.'));body.append(s);}paper.append(body,el('div','paper-footer',String(page+1)));target.append(paper);}$('magDialog').showModal();fitMagazine();if(document.fonts)document.fonts.ready.then(fitMagazine);}
function fitMagazine(){const source=Array.from($('magazine').children);let fit=false,chosen=13.33;for(let size=13.33;size>=10.65;size-=.34){const probes=source.map(p=>{const t=p.cloneNode(true);t.classList.add('print-measure');t.style.fontSize=size+'px';document.body.append(t);return t;});fit=probes.every(p=>{const b=p.querySelector('.paper-body'),footer=p.querySelector('.paper-footer');return b.getBoundingClientRect().bottom<=p.getBoundingClientRect().bottom-68&&footer.getBoundingClientRect().bottom<=p.getBoundingClientRect().bottom-50;});probes.forEach(p=>p.remove());chosen=size;if(fit)break;}source.forEach(p=>p.style.setProperty('--print-size',chosen+'px'));$('printWarning').hidden=fit;$('printWarning').textContent='두 페이지에 담기에는 분량이 깁니다. 내용을 자르지 않았습니다. 긴 답변을 줄인 뒤 PDF로 저장해주세요.';$('printMagazine').disabled=!fit;}
$('closeMagazine').onclick=()=>$('magDialog').close();$('printMagazine').onclick=()=>window.print();
function landing(){APP.replaceChildren();const c=el('section','center');c.append(el('h1','intro','서로의 인터뷰'),el('p','small','지인은 전달받은 인터뷰 초대 링크로 들어와 주세요. 답장 작성자는 작업소에서 이름을 등록하고, 그 사람에게 보낼 초대 링크를 만들 수 있습니다.'));const b=el('div','bottom');b.append(button('답장 작업소 열기','',()=>{location.hash='studio';location.reload();}),button('인터뷰 미리보기','text',()=>{location.hash='demo';location.reload();}));c.append(b);APP.append(c);}
(async()=>{if(!window.crypto?.subtle){APP.textContent='안전한 HTTPS 주소에서 최신 브라우저로 열어주세요.';return;}if(location.hash.startsWith('#i='))await openInvite();else if(location.hash==='#studio')await initStudio();else if(location.hash==='#demo'){guest={name:'',relationship:'',answers:Array(10).fill(''),step:-1,id:uuid()};guestKey='hugo-demo';renderGuest();}else landing();})().catch(e=>{APP.textContent='화면을 열지 못했습니다. 새로고침해주세요.';});
})();

<body>
<main id="app"><p class="loading">불러오는 중</p></main>
<div id="notice" class="notice" role="status" hidden></div>
<dialog id="linkDialog"><header><h2>인터뷰 초대 링크</h2><button id="closeLink" class="text">닫기</button></header><p class="small">이 링크를 받은 사람은 로그인 없이 인터뷰하고 답장을 읽을 수 있습니다. 다른 사람에게 전달하지 않도록 안내해주세요.</p><textarea id="shareLink" aria-label="초대 링크" rows="4" readonly></textarea><div class="dialog-actions"><button id="copyLink">링크 복사</button><button id="openLink" class="line">직접 열어보기</button></div><p class="small">링크에는 지금 저장한 답장 한 사람분만 담깁니다. 내용을 수정한 뒤에는 새 링크를 보내주세요. 공개 후 링크를 회수할 수는 없습니다.</p></dialog>
<dialog id="magDialog"><header><h2>매거진</h2><div><button id="printMagazine">PDF로 저장</button><button id="closeMagazine" class="text">닫기</button></div></header><p id="printWarning" class="small" hidden></p><div id="magazine"></div></dialog>
